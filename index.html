            "name": "Is BTT only for large technology projects?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. We work with small and medium businesses and start with the business problem. Sometimes the right answer is a focused automation or improvement—not a large rebuild."

          {
            "@type": "Question",
            "name": "How much does an engagement cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cost depends on the outcome, risk, and delivery scope. After the first conversation, we define a sensible first step and explain the investment clearly before any work begins."
            }
          },
          {
            "@type": "Question",
            "name": "How quickly can we start seeing value?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We aim to identify early value during discovery and deliver in practical stages. A focused improvement may take weeks, while a larger modernization programme is planned around measurable milestones."
            }
          },
          {
            "@type": "Question",
            "name": "Can you improve the systems we already have?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Replacing everything is rarely the first recommendation. We can assess existing websites, software, cloud environments, and workflows, then improve or integrate what is worth keeping."
            }
          },
          {
            "@type": "Question",
            "name": "How do you decide whether AI is actually useful?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We look for repetitive work, slow decisions, scattered knowledge, and customer friction. AI is recommended only when it creates a clear advantage and can be introduced responsibly."
            }
          },
          {
            "@type": "Question",
            "name": "What about security and sensitive business data?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Security, access control, privacy, and operational risk are considered from the beginning. Recommendations are matched to your organisation, data, industry, and practical risk level."
            }
          }
